<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            height: 100px;
            width: 100px;
            border : 1px solid black;
            margin : 100px;
            background-color: cadetblue;
            display: inline-block;
            transition: all 0.1s ease-in-out;
        }
        #container:hover{
            transform: scale(1.3);
            
            border-radius: 50%;
            transition: all 0.1s ease-in-out;
        }
        #container:active{
            transform: scale(1);
            background-color: cadetblue;
            border-radius: 0%;
            transition: all 0.1s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="container"></div>
    <div id="container"></div>
    <div id="container"></div>
</body>
</html>
