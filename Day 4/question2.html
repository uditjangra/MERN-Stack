<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <script>
        const y = [1,2,3,4,5];
        function sumOfArray(numbers){
            let sum = 0;
            for (const value of numbers){
                sum += value;
            }
            return sum;
        }
        console.log(sumOfArray(y));
    </script>
</head>
<body>
    <!-- Question : Write a JavaScript function that takes an array of numbers and returns the sum of all the numbers in the array. The function should take one parameter, numbers, which is an array of numbers, and return the calculated sum. -->
</body>
</html>
