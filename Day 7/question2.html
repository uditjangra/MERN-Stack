<!DOCTYPE html>
<html>
<head>
  <title>DOM Calculator</title>
</head>
<body>

<script>
  // Container
  const container = document.createElement("div");
  container.style.display = "flex";
  container.style.gap = "10px";
  container.style.margin = "40px";

  // First input
  const input1 = document.createElement("input");
  input1.type = "number";
  input1.placeholder = "Number 1";
  input1.style.padding = "8px";

  // Second input
  const input2 = document.createElement("input");
  input2.type = "number";
  input2.placeholder = "Number 2";
  input2.style.padding = "8px";

  // Operator selector
  const select = document.createElement("select");
  ["+", "-", "*", "/"].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.textContent = op;
    select.appendChild(option);
  });

  // Button
  const btn = document.createElement("button");
  btn.textContent = "Calculate";
  btn.style.padding = "8px 12px";

  // Click logic
  btn.onclick = () => {
    const a = Number(input1.value);
    const b = Number(input2.value);
    const op = select.value;
    let result;

    if (op === "+") result = a + b;
    if (op === "-") result = a - b;
    if (op === "*") result = a * b;
    if (op === "/") result = b !== 0 ? a / b : "Cannot divide by 0";

    alert("Result: " + result);
  };

  // Append everything
  container.append(input1, select, input2, btn);
  document.body.appendChild(container);
</script>

</body>
</html>
