<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .out{
            height: 150px;
            width: 300px;
            border: 3px black solid;
            padding: 30px;
            background-color: #d0eaff;
        }
        .in{
            height: 80px;
            width: 200px;
            border: 2px black dotted;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <!-- you have to create a box which has another box inside of it and it -->
    <div class="out">
        <div class="in">
            <p>Inner box.</p>
        </div>
    </div>

</body>
</html>
