<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>table {
  border-collapse: collapse;
  border: 2px solid rgb(140 140 140);
  font-family: sans-serif;
  font-size: 0.8rem;
  letter-spacing: 1px;
}

caption {
  caption-side: bottom;
  padding: 10px;
  font-weight: bold;
}

thead,
tfoot {
  background-color: rgb(228 240 245);
}

th,
td {
  border: 1px solid rgb(160 160 160);
  padding: 8px 10px;
}

td:last-of-type {
  text-align: center;
}

tbody > tr:nth-of-type(even) {
  background-color: rgb(237 238 242);
}

tfoot th {
  text-align: right;
}

tfoot td {
  font-weight: bold;
}</style>
</head>
<body>
    <table>
        <caption>Employee Information</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Age</th>
                <th scope="col">Gender</th>
            
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>John Smith</th>
                <td>28</td>
                <td>Male</td>
            </tr>
            <tr>
                <th>Sarah Johnson</th>
                <td>34</td>
                <td>Female</td>
            </tr>
            <tr>
                <th>Michael Brown</th>
                <td>45</td>
                <td>Male</td>
            </tr>
            <tr>
                <th>Emily Davis</th>
                <td>31</td>
                <td>Female</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">Total Employees</th>
                <td>4</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
